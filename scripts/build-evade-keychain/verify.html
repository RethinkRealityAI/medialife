<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head><body>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.toneMapping = THREE.NeutralToneMapping;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  const key = new THREE.DirectionalLight(0xffffff, 0.5); key.position.set(0.3, 0.5, 0.6); scene.add(key);
  const camera = new THREE.PerspectiveCamera(30, 1, 0.001, 10);
  let model;
  window.load = async (url, noTransmission) => {
    const gltf = await new GLTFLoader().loadAsync(url);
    model = gltf.scene; scene.add(model);
    if (noTransmission) model.traverse((o) => { if (o.material && o.material.transmission) o.material.transmission = 0; });
    const names = []; model.traverse((o) => names.push(`${o.type}:${o.name}`));
    const box = new THREE.Box3().setFromObject(model);
    return { names, size: box.getSize(new THREE.Vector3()).toArray(), min: box.min.toArray(), max: box.max.toArray() };
  };
  // view: {w,h,bg,target:[x,y,z],dir:[x,y,z],dist}
  window.shot = ({ w, h, bg, target, dir, dist, fov = 30, hide, keyI = 0.5, hideAcrylic, tone = 'neutral', exposure = 1 }) => {
    renderer.toneMapping = tone === 'aces' ? THREE.ACESFilmicToneMapping : THREE.NeutralToneMapping; renderer.toneMappingExposure = exposure;
    key.intensity = keyI;
    model.traverse((o) => { if (o.name.endsWith('_Acrylic')) o.visible = !hideAcrylic; });
    model.traverse((o) => { if (o.name.startsWith('Charm_')) o.visible = o.name !== hide; });
    renderer.setSize(w, h); camera.aspect = w / h; camera.fov = fov; camera.updateProjectionMatrix();
    scene.background = new THREE.Color(bg);
    const t = new THREE.Vector3(...target), d = new THREE.Vector3(...dir).normalize();
    camera.position.copy(t).addScaledVector(d, dist); camera.lookAt(t);
    renderer.render(scene, camera);
    return true;
  };
  window.ready = true;
</script>
</body></html>
