[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Lovable's vite config defaults Nitro to the Cloudflare target.
  # Pin it to Netlify explicitly so the build never depends on auto-detection.
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Canonical host: apex. www 301s to the apex so we have one indexable URL.
[[redirects]]
  from = "https://www.medialife.ai/*"
  to = "https://medialife.ai/:splat"
  status = 301
  force = true

# The creator program page used to live at /creators, before everything Roblox
# was gathered under one path. The old link was shared, so it still resolves.
[[redirects]]
  from = "/creators"
  to = "/roblox/creators/"
  status = 301

[[redirects]]
  from = "/creators/*"
  to = "/roblox/creators/:splat"
  status = 301

# Security headers for STATIC responses only. Netlify does not merge these onto
# responses from the SSR function, so every HTML page gets them from
# src/server.ts instead. Keep the two lists in sync.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Netlify serves .webmanifest as application/octet-stream. Combined with the
# nosniff header above, browsers refuse to parse it and the PWA icons/name are
# silently ignored — no console error. Set the correct type explicitly.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# Icons are content-addressed by name rather than hash, so cache them for a day
# rather than a year — long enough to matter, short enough to reissue the mark.
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The static form declaration is a build-time artifact for Netlify's form scanner
# and a POST target — never an indexable page.
[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── Roblox ───────────────────────────────────────────────────────────────────
# Everything for the Roblox program lives under one top-level path, so the
# creator program page and the partner portal share one set of rules and a
# future non-Roblox client portal can have its own. All of it is unlisted: the
# program page carries commercial terms, and the portal is a demo populated
# with mock pilot data.
#
# /roblox/creators is a static page under public/, so like the cards it is
# served straight from the CDN and DOES receive these headers. /roblox/portal
# is an SSR route and gets its own from src/server.ts — keep the two in sync.
[[headers]]
  for = "/roblox/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=300"

# Vendored three.js and the generated imagery only change when the page is
# rebuilt, so they can be cached hard.
[[headers]]
  for = "/roblox/creators/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/roblox/creators/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Activated-retail demos ───────────────────────────────────────────────────
# Interactive 3D endcaps used in pitches: /roblox/activated-retail (MEDIALIFE ×
# Roblox, falls under the /roblox rules above) and /monkey-quest/activated-retail
# (a concept for Toei Animation × Hypergalactic). Static pages under public/,
# unlisted like the rest of the client work. The short links are what gets shared.
[[redirects]]
  from = "/roblox-activated-retail"
  to = "/roblox/activated-retail/"
  status = 301

[[redirects]]
  from = "/monkey-quest-activated-retail"
  to = "/monkey-quest/activated-retail/"
  status = 301

[[redirects]]
  from = "/monkey-quest"
  to = "/monkey-quest/activated-retail/"
  status = 302

[[headers]]
  for = "/monkey-quest/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=300"

# Graphics, models and the display mesh change only when a demo is re-exported.
[[headers]]
  for = "/roblox/activated-retail/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/roblox/activated-retail/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/monkey-quest/activated-retail/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/monkey-quest/activated-retail/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/roblox/activated-retail/display.glb"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/monkey-quest/activated-retail/display.glb"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Native AR files, one pair per theme, exported from the live scene (public/vendor/ar-kit/ar-export.js).
# iOS AR Quick Look refuses a .usdz that isn't served as model/vnd.usdz+zip, and with nosniff on
# every response the type has to be right, so both types are set explicitly.
[[headers]]
  for = "/*/activated-retail/ar/*.usdz"
  [headers.values]
    Content-Type = "model/vnd.usdz+zip"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*/activated-retail/ar/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*/activated-retail/ar/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# /ar/ is the "View in your space" page the desktop AR QR code opens on a phone. Unlisted.
[[headers]]
  for = "/ar/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=300"

# three.js is vendored under a versioned path, so it can be cached forever.
[[headers]]
  for = "/vendor/three@0.170.0/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The activated-retail kit (analytics, AR launch/export, presentation, lead form) is NOT
# versioned by path, so browsers must revalidate it or fixes would take a year to arrive.
[[headers]]
  for = "/vendor/ar-kit/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# ── Virtual business cards ───────────────────────────────────────────────────
# Cards are static files at the site root (medialife.ai/dapo), so unlike the SSR
# routes they DO receive netlify.toml headers. The per-card noindex rules below
# are written by scripts/build-cards.mjs — edit team/*.json and re-run
# `npm run build:cards` rather than editing them here.

# Shared card CSS/JS/brand assets change only when a card is rebuilt.
[[headers]]
  for = "/card/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Without an explicit type the .vcf downloads as octet-stream and neither iOS nor
# Android offers an "Add to Contacts" handler — the whole point of the card.
[[headers]]
  for = "/*/*.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment"

# >>> generated by scripts/build-cards.mjs — do not edit by hand
[[headers]]
  for = "/dapo"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/dapo/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/sofia"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/sofia/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=300"
# <<< end generated
