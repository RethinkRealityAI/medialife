[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Lovable's vite config defaults Nitro to the Cloudflare target.
  # Pin it to Netlify explicitly so the build never depends on auto-detection.
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Canonical host: apex. www 301s to the apex so we have one indexable URL.
[[redirects]]
  from = "https://www.medialife.ai/*"
  to = "https://medialife.ai/:splat"
  status = 301
  force = true

# Security headers for STATIC responses only. Netlify does not merge these onto
# responses from the SSR function, so every HTML page gets them from
# src/server.ts instead. Keep the two lists in sync.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Netlify serves .webmanifest as application/octet-stream. Combined with the
# nosniff header above, browsers refuse to parse it and the PWA icons/name are
# silently ignored — no console error. Set the correct type explicitly.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# Icons are content-addressed by name rather than hash, so cache them for a day
# rather than a year — long enough to matter, short enough to reissue the mark.
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The static form declaration is a build-time artifact for Netlify's form scanner
# and a POST target — never an indexable page.
[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── Virtual business cards (/c/<slug>/) ──────────────────────────────────────
# Unlisted contact pages reached by QR, never linked from the site. These are
# plain static files in public/c/, so unlike the SSR routes they DO receive
# netlify.toml headers — the noindex below is the real one, alongside the
# <meta name="robots"> in each card and the Disallow in robots.txt.
[[headers]]
  for = "/c/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=300"

# Shared card CSS/JS/brand assets change only when a card is rebuilt.
[[headers]]
  for = "/c/_shared/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Without an explicit type the .vcf downloads as octet-stream and iOS/Android
# offer no "Add to Contacts" handler — the whole point of the card.
[[headers]]
  for = "/c/*/*.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment"
