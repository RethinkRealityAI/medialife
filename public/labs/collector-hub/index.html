<style>
  :root{--bg:#070b1c;--muted:#a3b0d0;--cyan:#36e3ff;--pink:#ff4fa3;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#eef3ff;overflow:hidden;
    font:500 15px/1.5 ui-sans-serif,-apple-system,"SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  .lab-tag{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 8px);z-index:1;font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.35);pointer-events:none}
  @media (max-width:700px){.lab-tag{display:none}}
  .loader{position:fixed;inset:0;z-index:2000300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);transition:opacity .5s}
  .loader.done{opacity:0;pointer-events:none}
  .kicker{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
  .bar{width:min(260px,70vw);height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .2s}
  .loader p{margin:0;color:var(--muted);font-size:14px}
  .err{color:#ffc0de}
</style>
