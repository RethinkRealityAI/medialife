<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Bobo keychain pop-out · MEDIALIFE Labs</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="importmap">
    {
      "imports": {
        "three": "/roblox/creators/vendor/three/build/three.module.js",
        "three/addons/": "/roblox/creators/vendor/three/jsm/"
      }
    }
  </script>
  <style>
    :root{--bg:#0b0d12;--panel:rgba(18,21,28,.78);--line:rgba(255,255,255,.12);--text:#eef3f6;--muted:#9aa6b2;--blue:#4fb4ff;--pink:#e85bd8;color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
    #stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
    header{position:fixed;top:0;left:0;right:0;padding:max(14px,env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;background:linear-gradient(#0b0d12d0,#0b0d1200)}
    header .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:700}
    header h1{font-size:18px;margin:2px 0 0;font-weight:800}
    header a{pointer-events:auto;color:var(--muted);font-size:13px;text-decoration:none;border:1px solid var(--line);padding:6px 10px;border-radius:999px;white-space:nowrap}
    #hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(72px + env(safe-area-inset-top));background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;color:var(--muted);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;transition:opacity .3s}
    nav{position:fixed;left:0;right:0;bottom:0;padding:10px 12px max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:linear-gradient(#0b0d1200,#0b0d12e0 40%)}
    nav button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:600 14px system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    nav button.primary{background:linear-gradient(90deg,var(--blue),var(--pink));border:0;color:#fff}
    nav button:disabled{opacity:.45;cursor:default}
    nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    #loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
    @media (max-width:520px){nav button{padding:0 12px;font-size:13px}header h1{font-size:16px}}
  </style>
</head>
<body>
  <canvas id="stage" aria-label="3D preview of the EVADE keychain with Bobo and the Eclipse can popping out"></canvas>
  <header>
    <div><div class="k">MEDIALIFE Labs · EVADE</div><h1>Keychain pop-out</h1></div>
    <a href="/labs/">All labs</a>
  </header>
  <div id="loading">Loading the keychain…</div>
  <div id="hint" hidden>Tap Bobo to wave, tap the can to spin it. Drag to look around.</div>
  <nav aria-label="Animation controls">
    <button id="b-pop" class="primary" disabled>Scan keychain</button>
    <button id="b-wave" disabled>Wave</button>
    <button id="b-wag" disabled>Wag tail</button>
    <button id="b-walk" disabled>Walk</button>
    <button id="b-key" disabled aria-pressed="true">Hide keychain</button>
  </nav>
  <script type="module" src="./main.js"></script>
</body>
</html>
