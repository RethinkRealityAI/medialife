<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MEDIALIFE">
  <title>MEDIALIFE</title>
  <defs>
    <!-- Brand gradient: cyan to magenta at 135deg. Mirrors the gradient-ember token. -->
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19affe"/>
      <stop offset="100%" stop-color="#ff2fae"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#7fd4ff"/>
      <stop offset="55%" stop-color="#19affe"/>
      <stop offset="100%" stop-color="#ff2fae"/>
    </radialGradient>

    <!-- Bloom around the orb. stdDeviation is tuned to the 64 unit viewBox. -->
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
  </defs>

  <!-- Dark tile keeps the orb legible on light AND dark browser chrome -->
  <rect width="64" height="64" rx="14" fill="#020202"/>

  <!-- Outer bloom -->
  <circle cx="32" cy="32" r="15.5" fill="url(#ember)" opacity="0.6" filter="url(#bloom)"/>

  <!-- Faint outer ring -->
  <circle cx="32" cy="32" r="20.5" fill="none" stroke="url(#ember)" stroke-width="1.5" opacity="0.28"/>

  <!-- Primary ring -->
  <circle cx="32" cy="32" r="14.5" fill="none" stroke="url(#ember)" stroke-width="3.1"/>

  <!-- Core -->
  <circle cx="32" cy="32" r="8.4" fill="url(#core)"/>

  <!-- Specular highlight -->
  <circle cx="29.2" cy="29" r="2.3" fill="#ffffff" opacity="0.55"/>
</svg>
