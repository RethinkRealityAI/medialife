<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form definitions</title>
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <!--
      Netlify detects forms by parsing STATIC HTML at deploy time. This site is
      server-rendered, so the real form in src/routes/contact.tsx is invisible to
      that scan. This file is the static declaration Netlify scans; the React form
      POSTs here as urlencoded data. Field names MUST stay in sync with contact.tsx.

      Do NOT name a field `ip` — Netlify reserves it and silently overwrites the
      submitted value with the client's IP address. Same applies to `name`,
      `title`, `body`, `summary`, `user_agent` and `referrer`. The "IP / Brand"
      field is therefore named `brand`.
    -->
    <form name="deployment-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="deployment-inquiry" />
      <input name="bot-field" type="text" />
      <input name="company" type="text" />
      <input name="email" type="email" />
      <input name="region" type="text" />
      <input name="duration" type="text" />
      <input name="brand" type="text" />
      <textarea name="msg"></textarea>
    </form>
    <!--
      Roblox creator program application (public/creators/index.html). That page
      is static so Netlify would scan it directly, but the declaration is kept
      here with the others so every form this site accepts is visible in one
      place. Field names MUST stay in sync with scripts/build-creators.mjs.

      Note the reserved-name rule above: the contact field is `contact-name`,
      not `name`, and the free-text field is `notes`, not `body`.
    -->
    <form
      name="roblox-creator-application"
      data-netlify="true"
      netlify-honeypot="company-website"
      hidden
    >
      <input type="hidden" name="form-name" value="roblox-creator-application" />
      <input name="company-website" type="text" />
      <input name="experience-name" type="text" />
      <input name="experience-url" type="url" />
      <input name="genre" type="text" />
      <input name="role" type="text" />
      <input name="monthly-visits" type="text" />
      <input name="peak-ccu" type="text" />
      <input name="merch-history" type="text" />
      <input name="community-links" type="text" />
      <input name="launch-window" type="text" />
      <input name="asset-readiness" type="text" />
      <input name="art-links" type="url" />
      <input name="commerce-setup" type="text" />
      <textarea name="notes"></textarea>
      <input name="contact-name" type="text" />
      <input name="email" type="email" />
      <input name="roblox-username" type="text" />
      <input name="discord" type="text" />
      <input name="rights-confirmed" type="text" />
      <input name="contact-consent" type="text" />
      <input name="program-updates" type="text" />
      <textarea name="drop-config"></textarea>
    </form>
    <!--
      "Book a call" on the activated-retail demos (public/vendor/ar-kit/lead.js,
      used by /roblox/activated-retail, /monkey-quest/activated-retail and the
      /x/ endcaps). The dialog is built in JS, so this is the only copy Netlify
      sees. Field names MUST stay in sync with lead.js.

      Reserved-name rule as above: the contact field is `contact-name` and the
      free-text field is `notes`. Hidden context: `demo` (which demo), `link` and
      `client` (the personal link's code and name, if any), `page` (the URL) and
      `source` (where the dialog was opened: tour_end, topbar, order, dashboard…).
    -->
    <form name="activated-retail-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="activated-retail-lead" />
      <input name="bot-field" type="text" />
      <input name="contact-name" type="text" />
      <input name="email" type="email" />
      <input name="company" type="text" />
      <textarea name="notes"></textarea>
      <input name="demo" type="text" />
      <input name="link" type="text" />
      <input name="client" type="text" />
      <input name="page" type="text" />
      <input name="source" type="text" />
    </form>
    <!--
      EVADE UGC creator sign-up (public/evade/creators/index.html, multi-step form
      driven by public/evade/creators/assets/js/page.js, which POSTs here as
      urlencoded data). Field names MUST stay in sync with that page and page.js.

      Reserved-name rule as above: the contact field is `contact-name` and the
      free-text field is `notes`. Platform fields are `<platform>_handle` and
      `<platform>_audience` for roblox, instagram, youtube, discord, x, tiktok;
      `platforms` is the comma list of the ones picked and `main_platform` the one
      marked main. Handles for instagram, x and tiktok are sent with a leading @.
    -->
    <form name="evade-ugc-creator" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="evade-ugc-creator" />
      <input name="bot-field" type="text" />
      <input name="contact-name" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="creator_name" type="text" />
      <input name="country" type="text" />
      <input name="platforms" type="text" />
      <input name="main_platform" type="text" />
      <input name="roblox_handle" type="text" />
      <input name="roblox_audience" type="text" />
      <input name="instagram_handle" type="text" />
      <input name="instagram_audience" type="text" />
      <input name="youtube_handle" type="text" />
      <input name="youtube_audience" type="text" />
      <input name="discord_handle" type="text" />
      <input name="discord_audience" type="text" />
      <input name="x_handle" type="text" />
      <input name="x_audience" type="text" />
      <input name="tiktok_handle" type="text" />
      <input name="tiktok_audience" type="text" />
      <input name="address_line1" type="text" />
      <input name="address_line2" type="text" />
      <input name="city" type="text" />
      <input name="region" type="text" />
      <input name="postal_code" type="text" />
      <input name="address_country" type="text" />
      <textarea name="notes"></textarea>
      <input name="consent" type="text" />
      <input name="source" type="text" />
      <input name="page" type="text" />
      <input name="utm_source" type="text" />
      <input name="utm_medium" type="text" />
      <input name="utm_campaign" type="text" />
      <input name="utm_content" type="text" />
      <input name="utm_term" type="text" />
    </form>
  </body>
</html>
