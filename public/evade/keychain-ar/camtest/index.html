<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Camera check · EVADE keychain AR</title>
  <style>
    html,body{margin:0;height:100%;background:#000;color:#fff;font:15px/1.45 system-ui,-apple-system,sans-serif}
    video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
    #panel{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(0,0,0,.72)}
    button{min-height:48px;padding:0 20px;border:0;border-radius:12px;background:#2f6fed;color:#fff;font:inherit;font-weight:700}
    pre{margin:10px 0 0;white-space:pre-wrap;font-size:13px;max-height:38vh;overflow:auto}
  </style>
</head>
<body>
  <video id="v" playsinline muted autoplay></video>
  <div id="panel">
    <button id="go" type="button">Start camera</button>
    <pre id="out" aria-live="polite">A plain camera with no AR, to check this phone's browser can show the back camera. Tap Start camera.</pre>
  </div>
  <script>
    const out = document.getElementById('out'), v = document.getElementById('v');
    const lines = []; const log = (s) => { lines.push(s); out.textContent = lines.join('\n'); };
    const record = { page: 'camtest', ua: navigator.userAgent, steps: [] };
    const t0 = performance.now(); const step = (s) => { record.steps.push({ s, ms: Math.round(performance.now() - t0) }); log(s); };
    const send = () => { try { navigator.sendBeacon('/api/ar/kc-diag', new Blob([JSON.stringify({ sid: 'camtest-' + Date.now().toString(36), ...record })], { type: 'application/json' })); } catch (e) {} };
    document.getElementById('go').onclick = async () => {
      step('Asking for the back camera…');
      try {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        const t = s.getVideoTracks()[0];
        step(`Got camera: ${t.label || '(no name)'}, state ${t.readyState}, muted ${t.muted}`);
        t.onmute = () => step('Camera track muted (another app or tab may have the camera)');
        t.onunmute = () => step('Camera track unmuted');
        v.srcObject = s;
        try { await v.play(); step('Video playing'); } catch (e) { step('Video play refused: ' + e.name); }
        let frames = 0;
        const tick = () => { frames++; if (frames === 1) step(`First frame: ${v.videoWidth}×${v.videoHeight}`); if (frames < 30) (v.requestVideoFrameCallback ? v.requestVideoFrameCallback(tick) : requestAnimationFrame(tick)); else { step('30 frames received: the camera works on this page.'); send(); } };
        v.requestVideoFrameCallback ? v.requestVideoFrameCallback(tick) : requestAnimationFrame(() => { if (v.videoWidth) tick(); });
        setTimeout(() => { if (!frames) { step('No frames after 5 seconds.'); send(); } }, 5000);
      } catch (e) { step('Camera refused: ' + e.name + ' ' + (e.message || '')); send(); }
    };
  </script>
</body>
</html>
